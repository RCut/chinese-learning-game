<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mandarin Street Corner (中文街角)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-in">
      <div class="brand">
        <div class="brand-logo">🏮</div>
        <h1>Mandarin Street Corner <span class="hz">(中文街角)</span></h1>
      </div>

      <div class="hdr-right">
        <div class="hdr-chips">
          <div class="chip chip-money" id="money-chip" title="Your money"><span>💰</span><span id="money-val" class="num">¥0</span></div>
          <div class="chip chip-xp" title="Experience"><span>⭐</span><span id="xp-val" class="num">0 XP</span></div>
          <button type="button" class="chip chip-level" id="level-chip" data-click="overview" title="Your level — open the journey">Lv 1</button>
        </div>
        <div class="hdr-nav">
          <nav class="seg dark">
            <button id="tab-stage" class="on" data-click="tab" data-arg="stage">🗺️ Stage</button>
            <button id="tab-notebook" data-click="tab" data-arg="notebook">📒 <span id="vocab-count" class="num">0</span> Words</button>
          </nav>
          <button type="button" id="tab-settings" class="gear" data-click="settings" aria-label="Settings" title="Settings">⚙️</button>
        </div>
      </div>

    </div>
  </header>

  <main class="main">
    <section id="log" class="log" aria-label="Notifications" aria-live="polite">
      <div class="log-bar"><span class="log-ic" aria-hidden="true">🔔</span><div id="log-latest" class="log-latest"></div><span id="log-n" class="log-n"></span><button type="button" id="log-toggle" class="log-toggle" data-click="log-toggle" aria-expanded="false" aria-label="Show or hide all notifications">▾</button></div>
      <div class="log-pop"><div id="log-list" class="log-list"></div><div class="log-foot"><button type="button" class="btn btn-ghost btn-sm" data-click="log-clear">Clear log</button></div></div>
    </section>
    <section id="view-stage" class="stage-layout">
      <div class="card stage-card">
        <h2 class="stage-title" id="stage-title">Street</h2>
        <div id="pills" class="pills"></div>
        <div class="board-wrap"><div id="board" class="board"><div id="board-gl" class="board-gl"></div><div id="board-dom" class="board-dom"></div></div><div id="stage-fade" class="stage-fade" aria-hidden="true"><span class="stage-fade-title"></span></div></div>
        <div class="dpad">
          <button data-click="move" data-arg="-1,0" aria-label="Left">◀</button>
          <button data-click="move" data-arg="0,-1" aria-label="Up">▲</button>
          <button data-click="move" data-arg="0,1" aria-label="Down">▼</button>
          <button data-click="move" data-arg="1,0" aria-label="Right">▶</button>
          <button class="act" data-click="interact">Talk</button>
        </div>
      </div>
      <div id="panel" class="card side-panel"></div>
    </section>

    <section id="view-notebook" class="hidden">
      <div class="nb-layout">
        <div class="card nb-card">
          <div class="nb-top">
            <div>
              <h2><span id="nb-title">My Vocabulary</span> (<span id="nb-total" class="num">0</span>)</h2>
              <div class="sub" id="nb-hint"></div>
            </div>
            <div class="search">
              <input id="vocab-search" class="field" type="search" placeholder="Search words…" />
              <button class="btn btn-ghost btn-sm" data-click="clear-search">Reset</button>
            </div>
          </div>
          <div id="nb-head" class="nb-head"></div>
          <div id="cats" class="cats"></div>
          <div id="vgrid" class="vgrid"></div>
        </div>
        <aside id="word-pane" class="word-pane"></aside>
      </div>
    </section>
    <section id="view-settings" class="hidden">
      <div class="card settings-card">
        <div class="settings-head"><h2>⚙️ Settings</h2><button type="button" class="btn btn-ghost btn-sm" data-click="settings">Done</button></div>

        <div class="set-sec">
          <h3>How Chinese is shown</h3>
          <div class="sub">Everywhere: conversations, tiles, name tags, the notebook.</div>
          <div class="opt-grid" id="tier-seg">
            <button type="button" data-click="tier" data-arg="1"><b>Pinyin</b><span class="ex">nǐ hǎo</span><small>sounds only</small></button>
            <button type="button" data-click="tier" data-arg="2"><b>Hybrid</b><span class="ex"><span class="ex-hz hz">你好</span><span class="ex-py">nǐ hǎo</span></span><small>characters + pinyin</small></button>
            <button type="button" data-click="tier" data-arg="3"><b>Hanzi</b><span class="ex"><span class="ex-hz hz">你好</span></span><small>characters only</small></button>
          </div>
        </div>

        <div class="set-sec">
          <h3>Voice</h3>
          <div class="sub">Used for the spoken words and sentences.</div>
          <div class="set-row"><label for="voice-select">Chinese voice</label><select id="voice-select" aria-label="Chinese voice"><option>Loading voices…</option></select></div>
          <div class="set-row"><label>Speed</label>
            <div class="seg" id="rate-seg">
              <button type="button" data-click="rate" data-arg="1">Fast</button>
              <button type="button" data-click="rate" data-arg="0.85">Normal</button>
              <button type="button" data-click="rate" data-arg="0.65">Slow</button>
            </div></div>
          <div class="set-row"><span></span><button type="button" class="btn btn-ghost btn-sm" data-click="test-voice">🔊 Test the voice</button></div>
        </div>

        <div class="set-sec">
          <h3>Sound</h3>
          <label class="toggle set-toggle"><input type="checkbox" id="sfx-on" checked> Sounds when you go through a door</label>
        </div>
      </div>
    </section>
  </main>

  <div id="writer-backdrop" class="writer-backdrop"></div>
  <section id="writer" class="writer" role="dialog" aria-modal="true" aria-label="Writing practice"></section>
  <div id="practice-backdrop" class="writer-backdrop" data-click="pr-close"></div>
  <section id="practice" class="practice" role="dialog" aria-modal="true" aria-label="Practice"></section>
  <div id="teach-backdrop" class="writer-backdrop" data-click="tc-later"></div>
  <section id="teach" class="practice" role="dialog" aria-modal="true" aria-label="New phrase"></section>

  <div id="levelup" class="levelup" role="dialog" aria-modal="true" aria-labelledby="levelup-title"><div class="levelup-card"><div class="levelup-burst">🎉</div><h3 id="levelup-title"></h3><p id="levelup-text"></p><div id="levelup-new" class="levelup-new"></div><button type="button" class="btn btn-primary btn-block" data-click="levelup-ok">Let’s go!</button></div></div>
  <div id="tooltip"><div class="tz" id="tip-zh"></div><div class="te" id="tip-en"></div></div>

  <!-- ART: pixel art drawn in code (no image files); the Phaser engine draws the places -->
  <script src="vendor/phaser.min.js"></script>
  <script src="js/core/art.js"></script>
  <script src="data/art/shared.js"></script>
  <script src="data/art/street.js"></script>
  <script src="data/art/cafe.js"></script>
  <script src="data/art/shop.js"></script>
  <script src="data/art/market.js"></script>
  <script src="data/art/home.js"></script>
  <script src="data/art/school.js"></script>

  <!-- DATA: edit these files to change content -->
  <script src="data/hsk.js"></script>
  <script src="data/dictionary.js"></script>
  <script src="data/characters.js"></script>
  <script src="data/vocab/core.js"></script>
  <script src="data/vocab/street.js"></script>
  <script src="data/vocab/cafe.js"></script>
  <script src="data/vocab/shop.js"></script>
  <script src="data/vocab/market.js"></script>
  <script src="data/vocab/hsk1.js"></script>
  <script src="data/vocab/hsk2.js"></script>
  <script src="data/vocab/hsk-chars.js"></script>
  <script src="data/vocab/home.js"></script>
  <script src="data/vocab/school.js"></script>
  <script src="data/world.js"></script>
  <script src="data/stages/street.js"></script>
  <script src="data/stages/cafe.js"></script>
  <script src="data/stages/shop.js"></script>
  <script src="data/stages/market.js"></script>
  <script src="data/stages/home.js"></script>
  <script src="data/stages/school.js"></script>
  <script src="data/menu.js"></script>
  <script src="data/quests.js"></script>
  <script src="data/ui-text.js"></script>
  <script src="data/phrases.js"></script>
  <script src="data/levels.js"></script>
  <script src="data/writing.js"></script>
  <script src="data/chat.js"></script>
  <script src="data/chats/market.js"></script>
  <script src="data/chats/home.js"></script>
  <script src="data/chats/school.js"></script>
  <script src="data/strokes.js"></script>
  <!-- CORE -->
  <script src="js/core/util.js"></script>
  <script src="js/core/dictionary.js"></script>
  <script src="js/core/pinyin.js"></script>
  <script src="js/core/stroke-match.js"></script>
  <script src="js/core/pattern.js"></script>
  <script src="js/core/state.js"></script>
  <script src="js/core/mastery.js"></script>
  <script src="js/core/phrases.js"></script>
  <script src="js/core/speech.js"></script>
  <script src="js/core/sfx.js"></script>
  <!-- UI -->
  <script src="js/ui/log.js"></script>
  <script src="js/ui/board.js"></script>
  <script src="js/ui/gestures.js"></script>
  <script src="js/ui/text.js"></script>
  <script src="js/ui/stroke-board.js"></script>
  <!-- GAME -->
  <script src="js/game/economy.js"></script>
  <script src="js/game/stage.js"></script>
  <script src="js/game/barista.js"></script>
  <script src="js/game/quizzes.js"></script>
  <script src="js/game/writing.js"></script>
  <script src="js/game/chat.js"></script>
  <script src="js/game/levels.js"></script>
  <!-- SCREENS -->
  <script src="js/ui/recognizer.js"></script>
  <script src="js/ui/panel.js"></script>
  <script src="js/ui/writer.js"></script>
  <script src="js/ui/wang-panel.js"></script>
  <script src="js/ui/chat-panel.js"></script>
  <script src="js/ui/howto.js"></script>
  <script src="js/ui/notebook.js"></script>
  <script src="js/ui/practice.js"></script>
  <script src="js/ui/teach.js"></script>
  <script src="js/ui/levelup.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
